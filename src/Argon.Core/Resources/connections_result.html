<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="argon-connection-result" content="{{ kind }}">
    <title>{{ title }} · Argon</title>
    {% if auto_continue == "1" %}<meta http-equiv="refresh" content="0;url={{ continue_url }}">{% endif %}
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0f1115;
            margin: 0;
            padding: 0;
            color: #e6e8ec;
        }

        .container {
            max-width: 480px;
            margin: 12vh auto 0;
            background-color: #181b22;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .kicker {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8b93a3;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: #c5cad4;
            margin: 0 0 20px;
        }

        .actions a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .primary {
            background-color: #5865f2;
            color: #ffffff;
        }

        .secondary {
            background-color: #262a33;
            color: #e6e8ec;
        }

        .footer {
            font-size: 12px;
            color: #6b7280;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="kicker">Argon · {{ provider }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="actions">
        {% if signin_url != "" %}<a class="primary" href="{{ signin_url }}" target="_blank" rel="noopener">Sign in to Argon</a>{% endif %}
        {% if continue_url != "" %}<a class="{% if signin_url != "" %}secondary{% else %}primary{% endif %}" href="{{ continue_url }}">Continue</a>{% endif %}
        {% if deep_link != "" %}<a class="primary" href="{{ deep_link }}">Back to Argon</a>{% endif %}
    </div>
    <div class="footer">You can close this tab once you are done.</div>
</div>
</body>
</html>
