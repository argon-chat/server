name: Production

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  # Wired in rather than left commented out, as it was before `tests.yml` became reusable. This is the
  # release path: an image published over a red suite is one somebody deploys.
  test:
    uses: ./.github/workflows/tests.yml
    with:
      database: postgres
      coverage: true
      threshold: 50

  # Seconds, and unrelated to the above: the bootstrapper is TypeScript and the install scripts are
  # shell. It gates the publish because the bootstrapper image *is* this code.
  installer:
    uses: ./.github/workflows/installer-tests.yml

  publish:
    needs: [test, installer]
    uses: ./.github/workflows/publish.yml
    permissions:
      id-token: write
      contents: read
      packages: write
    secrets: inherit

# Not gated on the CockroachDB run, which the canary workflow does on every push to development. That
# is a deliberate trade: it is the slow one, and master is reached through that branch. If a release
# should not go out without the engine production runs on having been exercised on the exact merge
# commit, add a second `uses: ./.github/workflows/tests.yml` with `database: cockroach` and put it in
# `needs` — nothing else has to change.
#
# The Docker Hub publish that used to sit here commented out has been removed rather than carried
# forward. It pushed `argonchat/argon-server`, a name nothing in this repository resolves any more —
# `compose.ts` and the deployment both name `ghcr.io/argon-chat/orleans`, and the stale one had already
# been copied into the bootstrapper once by someone reading it as current.
