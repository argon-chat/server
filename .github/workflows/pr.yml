name: Pull Request

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity normal

      - name: Verify Bot API Contracts
        run: dotnet run --project src/Argon.Api -- bot-api verify

  # PostgreSQL rather than CockroachDB: same migrations, same assertions, a fraction of the
  # start-up cost. The nightly canary replays the suite on CockroachDB.
  test:
    uses: ./.github/workflows/tests.yml
    with:
      database: postgres
      coverage: true
      threshold: 50
