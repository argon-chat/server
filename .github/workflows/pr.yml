name: Pull Request

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      # docs/internal is a private submodule (Argon team only): the runner has no access to it and
      # nothing in CI needs it, so the checkout takes no submodules and the public ones are
      # initialised by name. Keep this list in step with .gitmodules.
      - name: Init public submodules
        run: git submodule update --init --recursive -- src/Argon.Ion src/Argon.IonAdmin docs/bot-api-docs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restore
        run: dotnet restore

      # The Ion contracts are compiled to C# by the build. `frozen` fails it when a committed
      # ion.lock.json does not record the committed .ion schema: a local build never writes the lock.
      - name: Build
        run: dotnet build --no-restore --verbosity normal -p:IonLockMode=frozen

      - name: Verify bot event contracts
        run: dotnet run --project src/Argon.Api -- bot-api verify

      # The published description of the Bot API is a committed file, generated from the routes.
      # Regenerating it here and refusing a difference is what replaced hashing the routes: a
      # change to the API is a change to this file, visible in the diff as itself rather than as a
      # new hash. Regenerate with `bot-api openapi` and `bot-api docs`, commit the result in
      # docs/bot-api-docs and bump the submodule here.
      # `ls-files` first: diff says nothing about a file that was never committed.
      - name: Check the published Bot API description is current
        run: |
          dotnet run --project src/Argon.Api -- bot-api openapi
          dotnet run --project src/Argon.Api -- bot-api docs
          git -C docs/bot-api-docs ls-files --error-unmatch -- public/openapi.json src/data/api-manifest.json
          git -C docs/bot-api-docs diff --exit-code -- public/openapi.json src/data/api-manifest.json

  # PostgreSQL rather than CockroachDB: same migrations, same assertions, a fraction of the
  # start-up cost. The nightly canary replays the suite on CockroachDB.
  test:
    uses: ./.github/workflows/tests.yml
    # actions: read, for the coverage ratchet to fetch master's baseline from another run.
    permissions:
      contents: read
      actions: read
    with:
      database: postgres
      coverage: true
      threshold: 50
      ratchet: true
      ratchetTolerance: 0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
