name: Canary

# The development branch, tested on every push. It publishes nothing — images are built on master, so
# there is one channel and `:latest` means what it says.
#
# This used to watch `dev`, which stopped being the branch anyone pushed to in June 2025 — so for over
# a year every commit here ran no tests at all, silently, because a workflow that never triggers
# reports nothing to fail. The branch below is the one with a remote and with the work on it.

on:
  push:
    branches: ["development"]
    paths:
      - 'src/**/**'
      - 'tests/**/**'
      - 'deploy/selfhosted/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      database: postgres
      coverage: true
      threshold: 50

  # The same suite against the engine production actually runs. Slower to start, and the only
  # place the CockroachDB-specific migration DDL (LOCALITY, row TTL) is exercised at all.
  test-cockroach:
    uses: ./.github/workflows/tests.yml
    with:
      database: cockroach
      coverage: false
      threshold: 0

  # Seconds, and unrelated to everything above: the bootstrapper is TypeScript and the install scripts
  # are shell.
  installer:
    uses: ./.github/workflows/installer-tests.yml
